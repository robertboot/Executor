name: Build web bundle

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build the web bundle
        env:
          # Build-time stubs so the bundle compiles. The deployed host
          # (Vercel/Netlify) injects real values via its own env settings.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: stub
          EXPO_PUBLIC_QR_LANDING_BASE_URL: http://localhost:8081
        run: npx expo export --platform web --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          if-no-files-found: error
          retention-days: 14
